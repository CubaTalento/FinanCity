<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinanCity - Bienvenido</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:url("assets/Fondo.png") center center;
background-size:cover;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;

}

body::before{

content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.45);

}

.contenedor{

position:relative;
z-index:2;
width:92%;
max-width:420px;

}

.sofia{

width:220px;
display:block;
margin:auto;
animation:flotar 3s ease-in-out infinite;

}

@keyframes flotar{

0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}

}

.dialogo{

margin-top:20px;
background:white;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.35);

}

.nombre{

color:#0A4EA3;
font-size:26px;
font-weight:bold;
margin-bottom:15px;

}

.texto{

font-size:18px;
line-height:1.6;
color:#333;

}

.boton{

margin-top:25px;
width:100%;
padding:18px;
border:none;
border-radius:50px;
font-size:22px;
font-weight:bold;
background:#FFD400;
cursor:pointer;

}

.boton:hover{

background:#ffca00;

}

</style>

</head>

<body>

<div class="contenedor">

<img src="assets/SofIA.png" class="sofia">

<div class="dialogo">

<div class="nombre">

SofIA

</div>

<div class="texto">

¡Bienvenido a <b>FinanCity</b>.

Aquí descubrirás que cualquier persona puede aprender a administrar dinero, crear negocios y construir riqueza.

Comenzaremos con <b>500 SOF</b>.

Mi misión será ayudarte a convertir una pequeña idea en una gran ciudad.

¿Estás listo?

</div>

<button class="boton" onclick="location.href='juego.html'">

Comenzar

</button>

</div>

</div>

</body>
  </html>
