<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinanCity</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <h1>🏙️ FinanCity</h1>

    <p>Videojuego educativo de economía y emprendimiento.</p>


    <div id="jugador">

        <h2>Perfil del jugador</h2>

        <p>Nombre:</p>
        <strong id="nombreJugador"></strong>

        <p>Nivel:</p>
        <strong id="nivelJugador"></strong>

        <p>Experiencia:</p>
        <strong id="experienciaJugador"></strong>

    </div>


    <div id="economia">

        <h2>Economía</h2>

        <p>Dinero disponible:</p>
        <strong id="dinero"></strong>

        <br><br>

        <button id="ingreso">
            Recibir ingreso +100
        </button>

        <button id="gasto">
            Pagar gasto -50
        </button>

    </div>


    <div id="negocios">

        <h2>Mis negocios</h2>

        <p id="listaNegocios"></p>

    </div>


    <script src="js/economia.js"></script>
    <script src="js/negocios.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
