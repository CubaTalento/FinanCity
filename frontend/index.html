<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0a1733">

    <title>FinanCity</title>

    <link rel="stylesheet"
          href="css/menu.css">

</head>

<body>

<section id="inicio">

    <!-- =====================================
         CABECERA
    ====================================== -->

    <header class="header">

        <!-- Botón Sonido -->

        <button
            class="top-btn sonido"
            aria-label="Sonido">

            🔊

            <span>
                SONIDO
            </span>

        </button>

        <!-- Logo -->

        <div class="logo-contenedor">

            <img
                src="assets/Logo.png"
                alt="FinanCity"
                class="logo">

        </div>

        <!-- Botón Idioma -->

        <button
            class="top-btn idioma"
            aria-label="Idioma">

            🌐

            <span>
                IDIOMA
            </span>

        </button>

    </header>
        <!-- =====================================
         ESCENARIO PRINCIPAL
    ====================================== -->

    <main class="escenario">

        <!-- SofIA -->

        <div class="sofia-panel">

            <img
                src="assets/SofIA.png"
                alt="SofIA"
                class="sofia">

        </div>

        <!-- Zona derecha -->

        <div class="menu-panel">

            <!-- Globo -->

            <div class="dialogo">

                <h2>

                    👩 SofIA

                </h2>

                <p>

                    Bienvenido a
                    <strong>FinanCity</strong>.

                </p>

                <p>

                    Construye empresas,
                    administra tus recursos,
                    toma decisiones inteligentes
                    y conviértete en el mayor
                    magnate financiero.

                </p>

                <p>

                    ¿Estás listo para comenzar?

                </p>

            </div>

            <!-- Menú -->

            <nav class="menu-principal">

                <button
                    class="boton nueva"
                    onclick="window.location.href='intro.html'">

                    ▶ NUEVA PARTIDA

                </button>

                <button
                    class="boton continuar"
                    onclick="alert('Próximamente podrás continuar tu partida.')">

                    📂 CONTINUAR

                </button>

                <button
                    class="boton ajustes"
                    onclick="alert('Los ajustes estarán disponibles próximamente.')">

                    ⚙ AJUSTES

                </button>

            </nav>

        </div>

    </main>
      <!-- =====================================
         BARRA INFERIOR
    ====================================== -->

    <section class="barra-inferior">

        <button class="barra-btn">
            📘
            <span>Aprende</span>
        </button>

        <button class="barra-btn">
            💼
            <span>Emprende</span>
        </button>

        <button class="barra-btn">
            📈
            <span>Invierte</span>
        </button>

        <button class="barra-btn">
            🏆
            <span>Compite</span>
        </button>

        <button class="barra-btn">
            🚀
            <span>Progresa</span>
        </button>

    </section>

    <!-- =====================================
         PIE
    ====================================== -->

    <footer class="footer">

        <div class="version">

            FinanCity v0.1 Alpha

        </div>

        <div class="copyright">

            © 2026 FinanCity. Todos los derechos reservados.

        </div>

        <button
            class="privacidad"
            onclick="alert('Política de privacidad próximamente');">

            Privacidad

        </button>

    </footer>

</section>

</body>

</html>
